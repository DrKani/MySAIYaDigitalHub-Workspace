<!-- @dsCard group="Colors" viewport="700x140" name="Gold scale" subtitle="Sacred accent — never body text on light; borders/icons/dark only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--off-white);font-family:var(--font-ui)}
.row{display:flex;gap:8px}
.sw{flex:1;border-radius:var(--radius-md);height:80px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:var(--navy-900)}
.t{font-weight:700;font-size:11px}.h{font-size:10px;opacity:.8;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="row">
  <div class="sw" style="background:var(--gold-600);color:#fff"><span class="t">600</span><span class="h">B88A24</span></div>
  <div class="sw" style="background:var(--gold-500)"><span class="t">500</span><span class="h">D4AF37</span></div>
  <div class="sw" style="background:var(--gold-400)"><span class="t">400</span><span class="h">DAB757</span></div>
  <div class="sw" style="background:var(--gold-300)"><span class="t">300</span><span class="h">E5C158</span></div>
  <div class="sw" style="background:var(--gold-100)"><span class="t">100</span><span class="h">FFF7D6</span></div>
</div></body></html>
