<!-- @dsCard group="Colors" viewport="700x140" name="Purple scale" subtitle="Signal colour — notifications, popups, celebratory overlays" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--off-white);font-family:var(--font-ui)}
.row{display:flex;gap:8px}
.sw{flex:1;border-radius:var(--radius-md);height:80px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;color:#fff}
.t{font-weight:700;font-size:11px}.h{font-size:10px;opacity:.85;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="row">
  <div class="sw" style="background:var(--purple-950)"><span class="t">950</span><span class="h">210326</span></div>
  <div class="sw" style="background:var(--purple-900)"><span class="t">900</span><span class="h">36083D</span></div>
  <div class="sw" style="background:var(--purple-850)"><span class="t">850</span><span class="h">4A0F55</span></div>
  <div class="sw" style="background:var(--purple-800)"><span class="t">800</span><span class="h">5F176C</span></div>
  <div class="sw" style="background:var(--purple-700)"><span class="t">700</span><span class="h">7B2482</span></div>
  <div class="sw" style="background:var(--purple-600)"><span class="t">600</span><span class="h">9837A1</span></div>
  <div class="sw" style="background:var(--purple-500)"><span class="t">500</span><span class="h">B44DBE</span></div>
  <div class="sw" style="background:var(--purple-400);color:var(--navy-900)"><span class="t">400</span><span class="h">CF79D6</span></div>
  <div class="sw" style="background:var(--purple-300);color:var(--navy-900)"><span class="t">300</span><span class="h">E7B7EB</span></div>
  <div class="sw" style="background:var(--purple-100);color:var(--navy-900)"><span class="t">100</span><span class="h">F8EBFA</span></div>
</div></body></html>
