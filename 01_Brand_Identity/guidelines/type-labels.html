<!-- @dsCard group="Type" viewport="700x150" name="Action labels & casing" subtitle="ALL CAPS Poppins, wide tracking, ≤3 words only" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-ui);color:var(--navy-900)}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.lbl{font-weight:700;text-transform:uppercase;letter-spacing:0.08em;font-size:14px}
.micro{font-weight:800;text-transform:uppercase;letter-spacing:0.08em;font-size:10px;color:var(--purple-700)}
.note{margin-top:16px;font-size:13px;color:var(--gray-500)}
.pill{background:var(--gold-100);color:var(--gold-600);padding:6px 12px;border-radius:var(--radius-pill);font-weight:700;font-size:12px}
</style></head>
<body>
<div class="row">
  <span class="lbl">JOIN NOW</span>
  <span class="lbl">REGISTER</span>
  <span class="lbl">GET INVOLVED</span>
  <span class="micro">THIS WEEK'S WISDOM</span>
  <span class="pill">LEVEL 1</span>
</div>
<p class="note">Sentence case is the default for headings &amp; body. ALL CAPS only for buttons, badges and very short labels — always with wide tracking, never in paragraphs.</p>
</body></html>
