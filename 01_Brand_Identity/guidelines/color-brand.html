<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--off-white);font-family:var(--font-ui)}
.row{display:flex;gap:16px}
.sw{flex:1;border-radius:var(--radius-xl);padding:16px;min-height:96px;display:flex;flex-direction:column;justify-content:flex-end;box-shadow:var(--shadow-sm)}
.name{font-weight:700;font-size:14px}
.hex{font-size:12px;opacity:.85;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="row">
  <div class="sw" style="background:var(--brand-navy);color:#fff"><span class="name">Anchor Navy</span><span class="hex">#002E5B</span></div>
  <div class="sw" style="background:var(--brand-purple);color:#fff"><span class="name">Energy Purple</span><span class="hex">#7B2482</span></div>
  <div class="sw" style="background:var(--gradient-gold-wordmark);color:var(--navy-900)"><span class="name">Signature Gold</span><span class="hex">gradient</span></div>
</div></body></html>
