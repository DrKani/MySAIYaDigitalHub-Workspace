<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--off-white)}
.row{display:flex;gap:14px}
.cell{flex:1;height:128px;border-radius:var(--radius-xl);display:flex;align-items:center;justify-content:center;box-shadow:var(--shadow-sm);position:relative}
.cell span{position:absolute;bottom:8px;left:0;right:0;text-align:center;font-family:var(--font-ui);font-size:10px;font-weight:600;opacity:.7}
img{height:74px}
</style></head>
<body><div class="row">
  <div class="cell" style="background:var(--navy-900)"><img src="../assets/mysaiya-emblem.png" alt=""><span style="color:#fff">Navy-900</span></div>
  <div class="cell" style="background:var(--white);border:1px solid var(--gray-200)"><img src="../assets/mysaiya-emblem.png" alt=""><span style="color:var(--navy-900)">White</span></div>
  <div class="cell" style="background:var(--gradient-gold-wordmark)"><img src="../assets/mysaiya-emblem.png" alt=""><span style="color:var(--navy-900)">Gold gradient</span></div>
  <div class="cell" style="background:var(--gradient-purple-metallic)"><img src="../assets/mysaiya-emblem.png" alt=""><span style="color:#fff">Purple</span></div>
</div></body></html>
