<!-- @dsCard group="Colors" viewport="700x130" name="Game level gradients" subtitle="Levels 1–10 — growth → mastery → epic unlock" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--off-white);font-family:var(--font-ui)}
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:7px}
.sw{border-radius:var(--radius-md);height:70px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;color:#fff;font-weight:700;font-size:13px}
</style></head>
<body><div class="grid">
  <div class="sw" style="background:var(--gradient-level-1)">1</div>
  <div class="sw" style="background:var(--gradient-level-2)">2</div>
  <div class="sw" style="background:var(--gradient-level-3)">3</div>
  <div class="sw" style="background:var(--gradient-level-4)">4</div>
  <div class="sw" style="background:var(--gradient-level-5)">5</div>
  <div class="sw" style="background:var(--gradient-level-6)">6</div>
  <div class="sw" style="background:var(--gradient-level-7)">7</div>
  <div class="sw" style="background:var(--gradient-level-8)">8</div>
  <div class="sw" style="background:var(--gradient-level-9)">9</div>
  <div class="sw" style="background:var(--gradient-level-10);color:var(--navy-900)">10</div>
</div></body></html>
