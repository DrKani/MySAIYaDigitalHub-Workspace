<!-- @dsCard group="Spacing" viewport="700x190" name="Motion" subtitle="Calm durations & easing — hover lift on the cards" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-ui);color:var(--navy-900)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:18px}
.tile{background:var(--white);border:1px solid var(--gray-200);border-radius:var(--radius-lg);padding:12px 10px;text-align:center;transition:transform var(--duration-standard) var(--ease-out),box-shadow var(--duration-standard) var(--ease-out);box-shadow:var(--shadow-sm)}
.tile:hover{transform:translateY(-4px);box-shadow:var(--shadow-card-hover)}
.d{font-weight:700;font-size:16px}.l{font-size:10px;color:var(--gray-500);margin-top:3px}
.ease{font-size:12px;color:var(--gray-700)}
.ease code{font-family:ui-monospace,monospace;color:var(--purple-700)}
</style></head>
<body>
<div class="grid">
  <div class="tile"><div class="d">100ms</div><div class="l">instant</div></div>
  <div class="tile"><div class="d">200ms</div><div class="l">fast · hover</div></div>
  <div class="tile"><div class="d">300ms</div><div class="l">standard</div></div>
  <div class="tile"><div class="d">400ms</div><div class="l">slow · page</div></div>
  <div class="tile"><div class="d">600ms</div><div class="l">deliberate</div></div>
</div>
<p class="ease">Default easing <code>cubic-bezier(0.22, 0.61, 0.36, 1)</code> — natural deceleration. Hover lifts a card 4px; press moves down 1px. <em>Hover the tiles.</em></p>
</body></html>
