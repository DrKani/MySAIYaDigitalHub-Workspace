<!-- @dsCard group="Colors" viewport="700x160" name="Feature gradients" subtitle="Numbered 1–5 — assigned in layout order, never per module" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--off-white);font-family:var(--font-ui)}
.grid{display:grid;grid-template-columns:repeat(5,1fr);gap:10px}
.sw{border-radius:var(--radius-lg);height:96px;display:flex;align-items:flex-end;padding:10px;color:#fff;font-weight:700;font-size:15px;box-shadow:var(--shadow-sm);text-shadow:0 1px 2px rgba(0,0,0,0.35)}
</style></head>
<body><div class="grid">
  <div class="sw" style="background:var(--gradient-feature-1)">1</div>
  <div class="sw" style="background:var(--gradient-feature-2)">2</div>
  <div class="sw" style="background:var(--gradient-feature-3)">3</div>
  <div class="sw" style="background:var(--gradient-feature-4)">4</div>
  <div class="sw" style="background:var(--gradient-feature-5)">5</div>
</div></body></html>
