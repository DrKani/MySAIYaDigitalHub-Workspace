<!-- @dsCard group="Brand" viewport="700x340" name="Horizontal lockup & variants" subtitle="Full lockup + white-on-navy, gold, monochrome" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-ui)}
.full{background:#fff;border:1px solid var(--gray-200);border-radius:var(--radius-2xl);padding:24px;box-shadow:var(--shadow-card);margin-bottom:16px;display:flex;justify-content:center}
.full img{max-width:90%;height:auto}
.row{display:flex;gap:12px}
.cell{flex:1;border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-sm);display:flex}
.cell img{width:100%;height:auto;display:block}
</style></head>
<body>
<div class="full"><img src="../assets/mysaiya-lockup.png" alt="MySAIYa full horizontal lockup"></div>
<div class="row">
  <div class="cell"><img src="../assets/mysaiya-lockup-navy.png" alt="White on navy"></div>
  <div class="cell"><img src="../assets/mysaiya-lockup-gold.png" alt="On gold"></div>
  <div class="cell"><img src="../assets/mysaiya-lockup-mono.png" alt="Monochrome"></div>
</div>
</body></html>
