<!-- @dsCard group="Colors" viewport="700x150" name="Neutrals" subtitle="Off-white page · cream · gray spine · soft black" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:20px;background:var(--off-white);font-family:var(--font-ui)}
.row{display:flex;gap:8px}
.sw{flex:1;border-radius:var(--radius-md);height:88px;display:flex;flex-direction:column;justify-content:flex-end;padding:8px;border:1px solid var(--gray-200)}
.t{font-weight:700;font-size:11px}.h{font-size:9px;opacity:.7;font-variant-numeric:tabular-nums}
</style></head>
<body><div class="row">
  <div class="sw" style="background:var(--white);color:var(--navy-900)"><span class="t">white</span><span class="h">FFFFFF</span></div>
  <div class="sw" style="background:var(--off-white);color:var(--navy-900)"><span class="t">off-white</span><span class="h">FBFAF7</span></div>
  <div class="sw" style="background:var(--cream);color:var(--navy-900)"><span class="t">cream</span><span class="h">F7F3EA</span></div>
  <div class="sw" style="background:var(--gray-200);color:var(--navy-900)"><span class="t">gray-200</span><span class="h">E5E7EB</span></div>
  <div class="sw" style="background:var(--gray-400);color:#fff"><span class="t">gray-400</span><span class="h">9CA3AF</span></div>
  <div class="sw" style="background:var(--gray-500);color:#fff"><span class="t">gray-500</span><span class="h">6B7280</span></div>
  <div class="sw" style="background:var(--gray-700);color:#fff"><span class="t">gray-700</span><span class="h">374151</span></div>
  <div class="sw" style="background:var(--black-soft);color:#fff"><span class="t">black-soft</span><span class="h">111827</span></div>
</div></body></html>
