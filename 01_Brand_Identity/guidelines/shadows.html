<!-- @dsCard group="Spacing" viewport="700x180" name="Shadows & elevation" subtitle="Soft, modern — sm → modal, plus gold & purple tints" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:28px;background:var(--off-white);font-family:var(--font-ui);color:var(--navy-900)}
.row{display:flex;gap:24px;align-items:center;flex-wrap:wrap}
.item{display:flex;flex-direction:column;align-items:center;gap:10px}
.box{width:84px;height:64px;background:var(--white);border-radius:var(--radius-lg)}
.t{font-size:10px;color:var(--gray-500);font-weight:600}
</style></head>
<body><div class="row">
  <div class="item"><div class="box" style="box-shadow:var(--shadow-sm)"></div><span class="t">sm</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-md)"></div><span class="t">md</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-lg)"></div><span class="t">lg</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-xl)"></div><span class="t">xl</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-modal)"></div><span class="t">modal</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-gold)"></div><span class="t">gold</span></div>
  <div class="item"><div class="box" style="box-shadow:var(--shadow-purple)"></div><span class="t">purple</span></div>
</div></body></html>
