<!-- @dsCard group="Brand" viewport="700x180" name="Approved colour pairings" subtitle="Tested combinations for text on surface" -->
<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-ui)}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.cell{height:64px;border-radius:var(--radius-md);display:flex;align-items:center;justify-content:center;font-weight:600;font-size:15px;box-shadow:var(--shadow-sm)}
.note{margin-top:14px;font-size:12px;color:var(--gray-500)}
</style></head>
<body><div class="grid">
  <div class="cell" style="background:var(--navy-900);color:#fff">White on Navy</div>
  <div class="cell" style="background:var(--navy-900);color:var(--gold-500)">Gold on Navy</div>
  <div class="cell" style="background:var(--gold-500);color:var(--navy-900)">Navy on Gold</div>
  <div class="cell" style="background:var(--purple-700);color:#fff">White on Purple</div>
  <div class="cell" style="background:var(--teal-500);color:#fff">White on Teal</div>
  <div class="cell" style="background:var(--magenta-600);color:#fff">White on Magenta</div>
  <div class="cell" style="background:#fff;color:var(--navy-900);border:1px solid var(--gray-200)">Navy on White</div>
  <div class="cell" style="background:var(--off-white);color:var(--navy-900);border:1px solid var(--gray-200)">Navy on Off-white</div>
</div>
<p class="note">Avoid: gold text on white · navy on navy-700 · teal tight beside orange · many gradients in one viewport.</p>
</body></html>
