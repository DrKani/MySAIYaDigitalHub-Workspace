<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><link rel="stylesheet" href="../styles.css">
<style>
body{margin:0;padding:0;background:var(--navy-800)}
.box{min-height:180px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:32px;gap:14px}
.q{font-family:var(--font-serif);font-style:italic;font-weight:600;font-size:34px;line-height:1.4;letter-spacing:-0.01em;color:#fff;max-width:60ch}
.c{font-family:var(--font-sans);font-style:normal;font-size:15px;background:var(--gradient-gold-wordmark);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;font-weight:600}
</style></head>
<body><div class="box">
  <p class="q">&ldquo;Love all, serve all.&rdquo;</p>
  <cite class="c">Bhagawan Sri Sathya Sai Baba</cite>
</div></body></html>
