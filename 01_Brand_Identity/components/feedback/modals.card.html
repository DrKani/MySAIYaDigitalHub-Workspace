<!-- @dsCard group="Components" viewport="1060x900" name="Popups & modals" subtitle="Five locked patterns, each with exactly one job" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Popups & modals</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-ui);color:var(--navy-900)}a{color:var(--navy-700);text-decoration:none}a:hover{color:var(--purple-700)}h4{font:600 11px/1 Poppins;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin:0 0 12px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Modal, Button } = window.MySAIYaDesignSystem_424fc1;
const I = ({n,s=22}) => <i data-lucide={n} style={{width:s,height:s,display:'inline-flex'}} />;
const Caption = ({children}) => <div style={{textAlign:'center',fontSize:12,color:'var(--gray-500)',marginTop:10}}>{children}</div>;
function App() {
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(2, 460px)',gap:28,alignItems:'start',justifyContent:'center'}}>
      <div>
        <Modal pattern="locked" width="100%" icon={<I n="lock" />} title="Personal dashboard locked"
          actions={<Button variant="primary" shape="pill" uppercase>Sign up now</Button>}>
          Guest accounts do not store sadhana progress. Sign up to track your spiritual journey.
        </Modal>
        <Caption>Feature-locked prompt</Caption>
      </div>
      <div>
        <Modal pattern="consent" width="100%" icon={<I n="cookie" />} eyebrow="Cookie choices" title="Your privacy, your choice"
          actions={<React.Fragment>
            <Button variant="primary" shape="pill" uppercase>Accept</Button>
            <Button variant="secondary" shape="pill" uppercase>Decline</Button>
            <Button variant="tertiary" shape="pill" uppercase>Manage preferences</Button>
          </React.Fragment>}>
          <strong>Om Sai Ram.</strong> We use essential cookies to keep MySAIYa secure and reliable. Accept all, decline non-essential, or manage your preferences.
        </Modal>
        <Caption>Cookie / privacy consent</Caption>
      </div>
      <div>
        <Modal pattern="achievement" width="100%" icon={<I n="trophy" />} title="Knowledge checkpoint"
          actions={<React.Fragment>
            <Button variant="secondary" shape="pill">Mark as read</Button>
            <Button variant="primary" shape="pill">Take quiz</Button>
          </React.Fragment>}>
          Verify your understanding to earn this week&rsquo;s badge.
        </Modal>
        <Caption>Achievement / checkpoint</Caption>
      </div>
      <div>
        <Modal pattern="welcome" width="100%" title="Welcome to Sacred Crossword"
          actions={<React.Fragment>
            <Button variant="tertiary" shape="pill">Skip</Button>
            <Button variant="primary" shape="pill">Next</Button>
          </React.Fragment>}>
          Om Sai Ram! Uncover the divine journey word by word.
        </Modal>
        <Caption>Game welcome / onboarding</Caption>
      </div>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
