<!-- @dsCard group="Components" viewport="820x210" name="Badges & Chips" subtitle="Status badges and meaning-carrying chips" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:28px;background:var(--off-white)}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { Badge, Chip } = window.MySAIYaDesignSystem_424fc1;
const Row = ({label,children}) => (
  <div style={{marginBottom:18}}>
    <div style={{font:'600 11px/1 Poppins',letterSpacing:'0.08em',textTransform:'uppercase',color:'var(--gray-500)',marginBottom:10}}>{label}</div>
    <div style={{display:'flex',gap:10,alignItems:'center',flexWrap:'wrap'}}>{children}</div>
  </div>
);
ReactDOM.createRoot(document.getElementById('root')).render(
  <div>
    <Row label="Status badges">
      <Badge status="active">Active</Badge>
      <Badge status="admin">Admin</Badge>
      <Badge status="guest">Guest</Badge>
      <Badge status="pending">Pending</Badge>
      <Badge status="suspended">Suspended</Badge>
      <Badge status="points">120 points</Badge>
      <Badge status="achievement">Badge earned</Badge>
    </Row>
    <Row label="Chips">
      <Chip tone="gold">Milestone</Chip>
      <Chip tone="teal">Completed</Chip>
      <Chip tone="purple">Reflection</Chip>
      <Chip tone="orange">Live now</Chip>
      <Chip tone="navy">Week 4</Chip>
      <Chip tone="level" level={5}>Level 5</Chip>
      <Chip tone="level" level={10}>Level 10</Chip>
      <Chip tone="neutral">Tag</Chip>
    </Row>
  </div>
);
</script>
</body>
</html>
