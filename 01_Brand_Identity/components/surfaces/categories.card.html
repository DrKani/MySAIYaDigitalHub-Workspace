<!-- @dsCard group="Components" viewport="1000x830" name="Category cards" subtitle="Programme Directory tiles — one gradient and icon per family" -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Category cards</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-ui);color:var(--navy-900)}a{color:var(--navy-700);text-decoration:none}a:hover{color:var(--purple-700)}h4{font:600 11px/1 Poppins;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin:0 0 12px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { CategoryCard, CATEGORIES, Button } = window.MySAIYaDesignSystem_424fc1;
const I = ({n}) => <i data-lucide={n} style={{width:20,height:20,display:'inline-flex'}} />;
const items = [
  { category:'leadership', title:'MSYLP 2026',        description:'The national leadership pathway for Sai Young Adults.' },
  { category:'service',    title:'ROSE &amp; DARTS',  description:'Weekly community service across all Malaysian centres.' },
  { category:'spiritual',  title:'TRAC &amp; bhajans',description:'Vedic chanting, bhajan practice and cultural offerings.' },
  { category:'medical',    title:'Medical camps',     description:'Health screening, blood donation and outreach clinics.' },
  { category:'youth',      title:'YYLP · SSEHV',      description:'Skills, mentoring and values-led leadership learning.' },
  { category:'learning',   title:'Book Club &amp; blog', description:'Reading journeys, learning modules and reflections.' },
  { category:'events',     title:'National calendar', description:'Every upcoming and past event page in one directory.' },
  { category:'committee',  title:'Committee hub',     description:'Internal admin, strategy documents and the toolkit.' },
];
function App() {
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(3, 1fr)',gap:20}}>
      {items.map((it) => (
        <CategoryCard key={it.category} category={it.category}
          icon={<I n={CATEGORIES[it.category].icon} />}
          title={<span dangerouslySetInnerHTML={{__html: it.title}} />}
          description={it.description} />
      ))}
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
