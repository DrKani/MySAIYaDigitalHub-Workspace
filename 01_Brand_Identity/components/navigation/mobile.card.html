<!-- @dsCard group="Components" viewport="1160x640" name="Mobile navigation" subtitle="Bottom tab bar, drawer and sticky action bar. 44px minimum targets." -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile navigation</title>
<link rel="stylesheet" href="../../styles.css">
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="https://unpkg.com/lucide@latest/dist/umd/lucide.min.js"></script>
<script src="../../_ds_bundle.js"></script>
<style>body{margin:0;padding:24px;background:var(--off-white);font-family:var(--font-ui);color:var(--navy-900)}a{color:var(--navy-700);text-decoration:none}a:hover{color:var(--purple-700)}h4{font:600 11px/1 Poppins;letter-spacing:.08em;text-transform:uppercase;color:var(--gray-500);margin:0 0 12px}</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel">
const { BottomTabBar, Drawer, ActionBar, FilterPills, Card } = window.MySAIYaDesignSystem_424fc1;
const I = ({n,s=20}) => <i data-lucide={n} style={{width:s,height:s,display:'inline-flex'}} />;
const Note = ({children}) => <p style={{margin:'14px 0 0',fontSize:13,lineHeight:1.6,color:'var(--gray-500)'}}>{children}</p>;
function App() {
  const [filters, setFilters] = React.useState(['all']);
  React.useEffect(() => { window.lucide && window.lucide.createIcons(); });
  return (
    <div style={{display:'grid',gridTemplateColumns:'repeat(3, minmax(320px, 1fr))',gap:20,alignItems:'start'}}>
      <Card>
        <h4>Bottom tab bar</h4>
        <div style={{borderRadius:'var(--radius-xl)',overflow:'hidden',border:'1px solid var(--gray-200)'}}>
          <div style={{height:180,background:'#EEF3F9',display:'flex',alignItems:'center',justifyContent:'center',color:'var(--navy-700)',fontSize:14,fontWeight:600}}>Screen content</div>
          <BottomTabBar
            items={[{id:'home',label:'Home',icon:<I n="house" />},{id:'events',label:'Events',icon:<I n="calendar-days" />},{id:'play',label:'Play It',icon:<I n="dice-5" />},{id:'me',label:'Me',icon:<I n="user" />}]}
            active="home" fab={{label:'Add', icon:<I n="plus" s={22} />}} />
        </div>
        <Note>Five slots maximum. Active = navy icon + semibold label; inactive = gray-400. The gold FAB is the only gold element on the bar.</Note>
      </Card>

      <Card>
        <h4>Drawer</h4>
        <div style={{position:'relative',height:300,borderRadius:'var(--radius-xl)',overflow:'hidden',border:'1px solid var(--gray-200)',background:'#EEF3F9'}}>
          <Drawer open
            user={{initials:'AK', name:'Anand K.', meta:'Level 5 · 1,240 pts'}}
            active="book"
            items={[{id:'book',label:'Book club',icon:<I n="book-open" />},{id:'journal',label:'Journal',icon:<I n="notebook-pen" />},{id:'bhajans',label:'Bhajans',icon:<I n="music" />},{id:'settings',label:'Settings',icon:<I n="settings" />}]} />
        </div>
        <Note>Slides in 300ms with the standard easing. Scrim rgba(6,22,47,0.62); tap the scrim or swipe left to dismiss.</Note>
      </Card>

      <Card>
        <h4>Mobile header &amp; action bar</h4>
        <div style={{borderRadius:'var(--radius-xl)',overflow:'hidden',border:'1px solid var(--gray-200)'}}>
          <div style={{background:'var(--navy-900)',padding:'12px 14px',display:'flex',alignItems:'center',gap:12,color:'#fff'}}>
            <I n="menu" s={22} />
            <span style={{fontFamily:'var(--font-serif)',fontWeight:600,fontSize:17,lineHeight:1}}>My<span style={{background:'var(--gradient-gold-wordmark)',WebkitBackgroundClip:'text',backgroundClip:'text',color:'transparent'}}>SAI</span>Ya</span>
            <span style={{flex:1}} />
            <I n="bell" />
          </div>
          <div style={{padding:'12px 14px',background:'var(--white)',borderBottom:'1px solid var(--gray-200)',overflowX:'auto'}}>
            <FilterPills value={filters} onChange={setFilters} style={{flexWrap:'nowrap'}}
              options={[{id:'all',label:'All'},{id:'seva',label:'Seva'},{id:'study',label:'Study'},{id:'camps',label:'Camps'}]} />
          </div>
          <div style={{height:80,background:'#EEF3F9'}} />
          <ActionBar action={{label:'Register'}} secondary={{label:'Save', icon:<I n="bookmark" />}} />
        </div>
        <Note>Filter chips scroll horizontally and never wrap. The sticky action bar holds exactly one primary action.</Note>
      </Card>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
